<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="A clear icon of a person looking into a mirror, suitable for a favicon.">

  <defs>
    <clipPath id="mirror-clip-favicon">
      <rect x="52" y="15" width="30" height="70" rx="5"/>
    </clipPath>
  </defs>

  <rect x="50" y="12" width="34" height="76" rx="7" fill="#8d6e63" />
  <rect x="52" y="15" width="30" height="70" rx="5" fill="#e0f7fa" />

  <g id="person-favicon" fill="none" stroke="black" stroke-width="6" stroke-linecap="round">
    <circle cx="30" cy="30" r="10" fill="black" stroke="none"/>
    <line x1="30" y1="40" x2="30" y2="70" />
    <line x1="30" y1="45" x2="15" y2="55" />
    <line x1="30" y1="45" x2="45" y2="55" />
  </g>

  <g id="reflection-favicon" clip-path="url(#mirror-clip-favicon)" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <circle cx="70" cy="30" r="10" fill="#333" stroke="none"/>
    <line x1="70" y1="40" x2="70" y2="70" />
    <line x1="70" y1="45" x2="55" y2="55" />
    <line x1="70" y1="45" x2="85" y2="55" />
  </g>

</svg>